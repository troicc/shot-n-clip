[project]
name = "quote-strip-studio"
version = "0.3.0"
description = "Source-grounded YouTube quote-card pipeline for Xiaohongshu and WeChat, with deterministic V3 editorial quality gates."
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
qcard = "qcard.cli:main"
qcard-quality = "qcard.editorial_quality_v3.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["qcard*"]
