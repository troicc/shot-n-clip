name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CJK fonts for renderer tests
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev]"
      - run: bash -n bin/qcard bin/qcard-quality bin/qcard-promote bin/qcard-render-v4
      - run: python -m compileall -q src tests
      - name: Validate package version and JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import qcard
          assert qcard.__version__ == "0.4.0", qcard.__version__
          for path in sorted(Path("schemas").rglob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
          PY
      - run: pytest -q
