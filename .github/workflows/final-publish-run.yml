name: Final publishable output input bundle

on:
  push:
    branches:
      - agent/final-publish-artifact-run
    paths:
      - .github/workflows/final-publish-run.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'push' || github.head_ref == 'agent/final-publish-artifact-run'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-wqy-zenhei
      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
      - name: Fetch exact captions and source video
        shell: bash
        run: |
          set -euo pipefail
          URL='https://youtu.be/z-WfDn_0AWE'
          WORK='work/z-WfDn_0AWE'
          mkdir -p "$WORK/transcript"

          python -m yt_dlp \
            --no-playlist \
            --write-subs --write-auto-subs \
            --sub-langs 'en.*,en' \
            --sub-format vtt \
            --skip-download \
            -o "$WORK/transcript/source.%(ext)s" \
            "$URL"

          test -n "$(find "$WORK/transcript" -maxdepth 1 -type f -name '*.vtt' -print -quit)"

          python -m yt_dlp \
            --no-playlist \
            -f 'bv*[height<=720]+ba/b[height<=720]/b' \
            --merge-output-format mp4 \
            --remux-video mp4 \
            -o "$WORK/source_video.%(ext)s" \
            "$URL" \
          || python -m yt_dlp \
            --no-playlist \
            --extractor-args 'youtube:player_client=android_vr' \
            -f 'b[height<=720]/b' \
            --remux-video mp4 \
            -o "$WORK/source_video.%(ext)s" \
            "$URL"

          python - <<'PY'
          from pathlib import Path
          work = Path('work/z-WfDn_0AWE')
          target = work / 'source_video.mp4'
          if not target.exists():
              files = [p for p in work.glob('source_video.*') if p.is_file()]
              if not files:
                  raise SystemExit('source video missing')
              source = files[0]
              if source.suffix.lower() == '.mp4':
                  source.replace(target)
              else:
                  raise SystemExit(f'video is not mp4 after remux: {source}')
          print(target, target.stat().st_size)
          for path in sorted((work / 'transcript').glob('*.vtt')):
              print(path, path.stat().st_size)
          PY

          test -s "$WORK/source_video.mp4"
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: shot-n-clip-final-publish-inputs
          include-hidden-files: true
          compression-level: 3
          retention-days: 2
          path: |
            .
            !.git/**
            !.venv/**
            !**/__pycache__/**
            !.cache/**
